<title>Tarana vs 5G Fixed Wireless</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,500;100,700;112,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: pinned tab bar, one tab visible at a time, 1180px measure; maps and calculators sit in a controls|canvas split that stacks on phones. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface2:#e9eeeb; --ink:#15201b; --ink2:#4b5852; --muted:#78857f; --line:#d6ddd8; --line2:#c2ccc6;
  --accent:#1d5c3a; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --tag-m:#1d5c3a; --tag-c:#8a5a12; --tag-d:#4a4a8c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --grid:#e1e6e2; --axis:#c2ccc6;
  --display:"Archivo","Archivo Narrow","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(21,32,27,.06),0 8px 24px -12px rgba(21,32,27,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#171d1a; --surface2:#1f2723; --ink:#eef2ef; --ink2:#b9c3bd; --muted:#879490; --line:#2a332e; --line2:#3a453f;
  --accent:#62c08c; --accent-ink:#0f1412; --accent-soft:#1c3328;
  --tag-m:#62c08c; --tag-c:#e0a94a; --tag-d:#a6a2e8;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2ea02e; --s7:#9085e9;
  --grid:#242c28; --axis:#3a453f; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171d1a; --surface2:#1f2723; --ink:#eef2ef; --ink2:#b9c3bd; --muted:#879490; --line:#2a332e; --line2:#3a453f;
  --accent:#62c08c; --accent-ink:#0f1412; --accent-soft:#1c3328;
  --tag-m:#62c08c; --tag-c:#e0a94a; --tag-d:#a6a2e8;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2ea02e; --s7:#9085e9;
  --grid:#242c28; --axis:#3a453f; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(34px,5vw,58px);font-weight:800;font-stretch:112%;letter-spacing:-.01em}
h2{font-size:clamp(24px,3vw,34px);font-weight:700;font-stretch:100%;margin-block:0 10px}
h3{font-size:19px;font-weight:700;margin-block:0 6px}
h4{font-size:15px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
p{margin:0 0 12px;max-width:72ch}
.lead{font-size:18px;color:var(--ink2);max-width:70ch}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 60px}
@media (max-width:520px){.wrap{padding-inline:16px}}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
small,.small{font-size:13px;color:var(--ink2)}
.muted{color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}

/* nav */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;padding-block:0;min-height:52px}
.brand{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:17px;white-space:nowrap}
.brand b{color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13.5px;font-weight:500;padding:16px 11px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ver{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.tbbar{background:var(--surface);border-bottom:1px solid var(--line)}
.tbbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;min-height:0}
.tbbar .eyebrow{white-space:nowrap}
#tbPick{display:flex;gap:6px;flex-wrap:wrap}
#tbPick button{appearance:none;font:inherit;font-weight:600;font-size:13px;padding:7px 14px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:999px;cursor:pointer}
#tbPick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbhero{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 10px;padding:12px 16px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
.tbhero .eyebrow{color:var(--accent)}
.tbhero .name{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:clamp(20px,2.6vw,28px);line-height:1.1}
.tbhero .tag{font-size:13px;color:var(--ink2);border:0;padding:0;margin:0;font-family:var(--body);letter-spacing:0;text-transform:none}
section.panel{display:none;padding-top:34px}
section.panel.active{display:block}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:36px;align-items:end;padding-block:46px 30px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero .thesis{font-size:19px;color:var(--ink2);margin-top:18px;max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-block:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;color:var(--ink)}
.tile .l{font-size:13px;color:var(--ink2);line-height:1.3}
.tile .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}

/* content blocks */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}
.cols>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0;max-width:80ch}
.callout p:last-child{margin:0}
.secthead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:38px 0 14px;padding-top:14px;border-top:1px solid var(--line)}
.secthead .eyebrow{min-width:70px}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px 12px;margin:14px 0;min-width:0}
.figure figcaption,.cap{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.45;max-width:none}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:1px 5px;border-radius:3px;border:1px solid currentColor;line-height:1.4;vertical-align:middle;margin-left:3px}
.tag.m{color:var(--tag-m)}.tag.c{color:var(--tag-c)}.tag.d{color:var(--tag-d)}
.legendkeys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin:8px 0 4px}
.legendkeys span{display:inline-flex;align-items:center;gap:6px}

/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-weight:600;color:var(--ink2);font-size:12.5px;background:var(--surface2);position:sticky;top:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);min-width:150px;font-weight:600;color:var(--ink2);box-shadow:1px 0 0 var(--line)}
.matrix th:first-child{background:var(--surface2);z-index:2}
.matrix td{min-width:170px;font-size:13px;line-height:1.4}
.matrix thead th .swatch{margin-right:6px}
.compact td,.compact th{white-space:nowrap;padding:6px 9px;font-size:12.5px}
.compact.wrap td,.compact.wrap th{white-space:normal}

/* controls */
.ctl{display:flex;flex-direction:column;gap:14px}
.ctl label,.fld label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld .row{display:flex;align-items:center;gap:8px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.fld output{font-family:var(--mono);font-size:12.5px;min-width:64px;text-align:right;color:var(--ink)}
select,input[type=number]{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;width:100%}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{appearance:none;font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{appearance:none;font:inherit;font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.split>*{min-width:0}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:22px}
.cols2>*{min-width:0}
.econ td:first-child,.econ th:first-child{min-width:210px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.sticky{position:sticky;top:70px}
@media (max-width:900px){.sticky{position:static}}

/* map */
.mapbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mapbox canvas{display:block;width:100%;height:auto}
.mapbox svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.readout{font-family:var(--mono);font-size:12px;line-height:1.5;background:var(--surface2);border-radius:8px;padding:10px 12px;min-height:120px;white-space:pre-wrap}
.ramp{display:flex;align-items:stretch;gap:0;height:12px;border-radius:3px;overflow:hidden;margin:6px 0 2px}
.ramp span{flex:1}
.rampl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.statbars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.statbars .r{display:grid;grid-template-columns:118px 1fr 70px;gap:8px;align-items:center;font-size:12.5px}
.statbars .b{height:10px;border-radius:0 3px 3px 0;background:var(--s1);min-width:1px}
.statbars .n{font-family:var(--mono);font-size:12px;text-align:right}

/* charts */
.chart{width:100%;height:auto;display:block;font-family:var(--body)}
.chart text{fill:var(--ink2);font-size:12px}
.chart .axis line,.chart .axis path{stroke:var(--axis);stroke-width:1}
.chart .grid line{stroke:var(--grid);stroke-width:1}
.chart .lbl{fill:var(--ink);font-weight:600}
.chart .ttl{fill:var(--ink);font-weight:600;font-size:13px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;box-shadow:var(--shadow);max-width:280px;display:none;line-height:1.4;font-family:var(--mono)}

/* diagrams */
.diag{width:100%;height:auto;display:block}
.diag text{font-family:var(--body);font-size:12px;fill:var(--ink2)}
.diag .t{fill:var(--ink);font-weight:600;font-size:13px}
.diag .ln{stroke:var(--ink2);stroke-width:1.5;fill:none}
.diag .ray{stroke-width:1.5;fill:none;opacity:.85}
.diag .ground{fill:var(--surface2)}
.diag .tree{fill:#3f8a52;opacity:.75}
.diag .house{fill:var(--line2);stroke:var(--ink2);stroke-width:1}

/* lists kept to prose; definition grid for glossary */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px 24px;font-size:14px}
.gloss div{min-width:0;padding:6px 0;border-bottom:1px solid var(--line)}
.gloss b{font-family:var(--mono);font-size:13px;color:var(--ink)}
.src{font-size:13px;color:var(--ink2);columns:2;column-gap:28px}
@media (max-width:760px){.src{columns:1}}
.src div{break-inside:avoid;margin-bottom:6px;padding-left:2.6em;text-indent:-2.6em}
.src .n{font-family:var(--mono);color:var(--muted)}
.src a{word-break:break-all;color:var(--ink2)}
.missing{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.missing .card h3{font-size:16px}
.missing .card p{font-size:14px;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono)}
.footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px 24px}
@media (prefers-reduced-motion:no-preference){.tab,.seg button,.btn{transition:background .15s,color .15s,border-color .15s}}
</style>
